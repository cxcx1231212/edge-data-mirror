<!doctype html><html lang="zh-CN"><head>  <meta charset="utf-8">  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">  <title>平特一肖高手榜预览</title>  <style>    *{box-sizing:border-box}    html{background:#050505}    body{margin:0;background:#050505;color:#eee;font-family:"Microsoft YaHei","PingFang SC",sans-serif}    .site{width:min(100%,760px);min-height:100vh;margin:auto;background:#101010}    .topbar{position:sticky;top:0;z-index:5;height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#070707;border-bottom:1px solid #29241a}    .back{color:#f1c85a;text-decoration:none;font-size:17px}    .inner-title{color:#fff;font-size:19px;font-weight:700}    .top-spacer{width:38px}    .page{padding:14px 10px 28px}    .panel{overflow:hidden;border:1px solid #30291c;border-radius:12px;background:#100f0f;box-shadow:0 12px 36px #000}    h1{margin:0;padding:18px 10px 13px;text-align:center;color:#d6a942;font-size:23px;line-height:1.2}    .notice{margin:0 10px 10px;padding:10px 6px;border-radius:8px;background:#080808;color:#ff2929;text-align:center;font-size:15px;font-weight:900}    .records{margin:0 10px;border:1px solid #2a251a;border-radius:9px;background:#070707;overflow:hidden}    .record{display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:12px 9px;border-bottom:1px solid #30291d;white-space:nowrap;font-size:clamp(11px,3.35vw,17px);font-weight:900;line-height:1.25}    .record:last-child{border-bottom:0}    .issue{color:#ddb34e}    .name{padding:2px 4px;border-radius:2px;background:#00a950;color:#fff}    .category{color:#8b28dc}    .pick,.result{color:#ff2525}    .bracket{color:#d9aa43}    .locked{color:#ff2929}    .steps{padding:17px 12px 19px;text-align:center;font-size:14px;font-weight:800;line-height:1.8}    .steps p{margin:4px 0;color:#eee}    .step-no{color:#ff2525}    .register{display:inline-block;margin-left:5px;padding:4px 13px;border:1px solid #ff3030;border-radius:4px;background:#b50d0d;color:#fff;text-decoration:none;font-weight:900}    .tip{margin-top:10px;color:#d7ae47;font-size:12px}    .site-footer{padding:24px 14px 28px;border-top:1px solid #6a531e;background:linear-gradient(180deg,#12100a,#090909);text-align:center;color:#8f8f8f}    .site-footer strong{display:block;margin-bottom:8px;color:#e6c45e;font-size:17px}    .site-footer p{margin:5px 0;font-size:12px}    .to-top{margin-top:12px;padding:8px 18px;border:1px solid #65501e;border-radius:7px;background:#1c170c;color:#e4c35e;font:700 13px inherit;cursor:pointer}    @media(max-width:430px){      .page{padding:8px 5px 20px}      h1{font-size:20px}      .notice{font-size:12px;padding:9px 3px}      .records{margin:0 5px}      .record{gap:3px;padding:11px 4px;font-size:clamp(9px,2.8vw,12px);letter-spacing:-.35px}      .name{padding:2px}      .steps{padding:14px 5px 17px;font-size:12px}    }  </style></head><body>  <div class="site">  <header class="topbar"><a class="back" href="index.html">返回</a><strong class="inner-title">平特一肖高手榜</strong><span class="top-spacer"></span></header>  <main class="page">    <section class="panel">      <h1>会员资料</h1>      <p class="notice">本资料最早发布在平特一肖高手榜，往期记录可查</p>      <div class="records"><div class="record"><span class="locked">资料读取中…</span></div></div>      <div class="steps">        <p><span class="step-no">第①步骤：</span>未注册账号点击这里→<a class="register" href="https://6hgs01z.duoldq.com/?channelCode=111222" target="_blank" rel="noopener">注册会员</a></p>        <p><span class="step-no">第②步骤：</span>注册完成后由网站自动进入登录页面</p>        <div class="tip">注册登录后即可查看当期资料</div>      </div>    </section>  </main>  <footer class="site-footer">    <strong>一路发平特一肖资料站</strong>    <p>资料仅供参考，请理性浏览</p>    <p>© 2026 平特资料站</p>    <button class="to-top" type="button" onclick="scrollTo({top:0,behavior:'smooth'})">返回顶部</button>  </footer>  </div><script>(async()=>{const id=new URLSearchParams(location.search).get('id');if(!id)return;try{const r=await fetch('/api/member-posts?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok||!d.success||!d.post)throw 0;document.querySelector('.panel h1').textContent=d.post.title;const footer=String(d.post.footer_html||'');if(footer){const tpl=document.createElement('template');tpl.innerHTML=footer;tpl.content.querySelectorAll('script,iframe,object,embed,form,meta,link').forEach(el=>el.remove());tpl.content.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(attr=>{if(/^on/i.test(attr.name)||(/^(href|src)$/i.test(attr.name)&&/^javascript:/i.test(attr.value.trim())))el.removeAttribute(attr.name)}));document.querySelector('.steps').replaceChildren(tpl.content.cloneNode(true));}const sample=String(d.post.content||'').match(/《[^》]+》\s*([^【\r\n]+)/);const author=String(d.post.author||(String(d.post.content||'').match(/《[^》]+》/)||['《平特主任》'])[0]),kind=String(d.post.type||(sample?.[1]||'平特一肖')).trim();const lotteryType=[1,5,8].includes(Number(d.post.lottery_type))?Number(d.post.lottery_type):5,historyCount=Math.min(200,Math.max(1,Number(d.post.history)||20)),year=new Date().getFullYear(),first=await fetch('/api/history.php?lotteryType='+lotteryType+'&pageNum=1&year='+year,{cache:'no-store'}).then(x=>x.json());const pages=Math.min(Math.max(1,Number(first?.data?.pager?.totalPageCount||first?.data?.totalPageCount||first?.data?.pages)||1),Math.ceil(historyCount/10)+1),jobs=[];for(let p=2;p<=pages;p++)jobs.push(fetch('/api/history.php?lotteryType='+lotteryType+'&pageNum='+p+'&year='+year,{cache:'no-store'}).then(x=>x.json()));const rest=await Promise.all(jobs.map(job=>job.catch(()=>({data:{recordList:[]}})))),list=x=>{const find=v=>{if(Array.isArray(v)&&v.some(r=>r&&typeof r==='object'&&Array.isArray(r.numberList)))return v;if(v&&typeof v==='object')for(const child of Object.values(v)){const found=find(child);if(found.length)return found}return[]};return find(x)},records=[...list(first),...rest.flatMap(list)].map(record=>{const match=String(record.period||record.issueNo||'').match(/(\d{3})$/),balls=(record.numberList||[]).filter(x=>x?.shengXiao);return match&&balls.length?{issue:Number(match[1]),period:match[1],balls}:null}).filter(Boolean).sort((a,b)=>a.issue-b.issue);if(!records.length){const htmlText=await fetch('/history.html?lotteryType='+lotteryType+'&year='+year,{cache:'no-store'}).then(x=>x.text()),doc=new DOMParser().parseFromString(htmlText,'text/html');records=[...doc.querySelectorAll('.history-record')].map(row=>{const match=String(row.querySelector('.period')?.textContent||'').match(/(\d{3})\s*期/),balls=[...row.querySelectorAll('.history-zodiac')].map(x=>({shengXiao:String(x.textContent||'').trim()})).filter(x=>x.shengXiao);return match&&balls.length?{issue:Number(match[1]),period:match[1],balls}:null}).filter(Boolean).sort((a,b)=>a.issue-b.issue)}const box=document.querySelector('.records'),colors=['#f5c84b','#25d6e8','#b561ff','#ff4b4b'];const add=(div,text,color,tag='span')=>{const el=document.createElement(tag);el.textContent=text;el.style.color=color;el.style.fontWeight='900';div.appendChild(el);return el};const nodes=records.slice(-historyCount).map(record=>{const div=document.createElement('div');div.className='record';const seed=[...String(id)+record.period].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7),pick=record.balls[seed%record.balls.length].shengXiao;add(div,record.period+'期：',colors[0]);add(div,author,colors[1]);add(div,kind,colors[2]);add(div,'【'+pick+'】',colors[3]);add(div,'准','#f5c84b');return div});if(records.length){const last=records[records.length-1],div=document.createElement('div');div.className='record';add(div,String(last.issue+1).padStart(3,'0')+'期：',colors[0]);add(div,author,colors[1]);add(div,kind,colors[2]);const current=String(d.post.current_data||'注册提前看料').replace(/^【|】$/g,'');const link=add(div,'【'+current+'】','#ff4b4b','a');link.href='https://6hgs01z.duoldq.com/?channelCode=111222';link.target='_blank';link.style.textDecoration='none';nodes.push(div)}box.replaceChildren(...nodes)}catch(_){document.querySelector('.records').textContent='会员贴读取失败，请刷新重试'}})();</script></body></html>
