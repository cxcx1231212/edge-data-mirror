<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>平特一肖高手榜预览</title>
  <style>
    *{box-sizing:border-box}
    html{background:#050505}
    body{margin:0;background:#050505;color:#eee;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
    .site{width:min(100%,760px);min-height:100vh;margin:auto;background:#101010}
    .topbar{position:sticky;top:0;z-index:5;height:58px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;background:#070707;border-bottom:1px solid #29241a}
    .back{color:#f1c85a;text-decoration:none;font-size:17px}
    .inner-title{color:#fff;font-size:19px;font-weight:700}
    .top-spacer{width:38px}
    .page{padding:14px 10px 28px}
    .panel{overflow:hidden;border:1px solid #30291c;border-radius:12px;background:#100f0f;box-shadow:0 12px 36px #000}
    h1{margin:0;padding:18px 10px 13px;text-align:center;color:#d6a942;font-size:23px;line-height:1.2}
    .notice{margin:0 10px 10px;padding:10px 6px;border-radius:8px;background:#080808;color:#ff2929;text-align:center;font-size:15px;font-weight:900}
    .records{margin:0 10px;border:1px solid #2a251a;border-radius:9px;background:#070707;overflow:hidden}
    .record{display:flex;align-items:center;gap:7px;width:100%;min-width:0;padding:12px 9px;border-bottom:1px solid #30291d;white-space:nowrap;font-size:clamp(11px,3.35vw,17px);font-weight:900;line-height:1.25}
    .record:last-child{border-bottom:0}
    .issue{color:#ddb34e}
    .name{padding:2px 4px;border-radius:2px;background:#00a950;color:#fff}
    .category{color:#8b28dc}
    .pick,.result{color:#ff2525}
    .bracket{color:#d9aa43}
    .locked{color:#ff2929}
    .steps{padding:18px 12px;text-align:center;font-size:14px;font-weight:800;line-height:1.9;color:#f6cb51;border-top:1px solid #332a19}
    .steps p{margin:4px 0;color:inherit}
    .steps a{color:#ff4b4b;text-decoration:none;font-weight:900}
    .shared-detail-footer{margin:14px 0 4px;padding:18px 12px;text-align:center;line-height:1.9;color:#f6cb51;border-top:1px solid #332a19}
    .shared-detail-footer a{color:#ff4b4b;text-decoration:none;font-weight:900}
    .step-no{color:#ff2525}
    .register{display:inline-block;margin-left:5px;padding:4px 13px;border:1px solid #ff3030;border-radius:4px;background:#b50d0d;color:#fff;text-decoration:none;font-weight:900}
    .tip{margin-top:10px;color:#d7ae47;font-size:12px}
    .site-footer{padding:24px 14px 28px;border-top:1px solid #6a531e;background:linear-gradient(180deg,#12100a,#090909);text-align:center;color:#8f8f8f}
    .site-footer strong{display:block;margin-bottom:8px;color:#e6c45e;font-size:17px}
    .site-footer p{margin:5px 0;font-size:12px}
    .to-top{margin-top:12px;padding:8px 18px;border:1px solid #65501e;border-radius:7px;background:#1c170c;color:#e4c35e;font:700 13px inherit;cursor:pointer}
    @media(max-width:430px){
      .page{padding:8px 5px 20px}
      h1{font-size:20px}
      .notice{font-size:12px;padding:9px 3px}
      .records{margin:0 5px}
      .record{gap:3px;padding:11px 4px;font-size:clamp(9px,2.8vw,12px);letter-spacing:-.35px}
      .name{padding:2px}
      .steps{padding:14px 5px 17px;font-size:12px}
    }
  </style>
</head>
<body>
  <div class="site">
  <header class="topbar"><a class="back" href="index.html">返回</a><strong class="inner-title">平特一肖高手榜</strong><span class="top-spacer"></span></header>
  <main class="page">
    <section class="panel">
      <h1>【平特一肖】</h1>
      <p class="notice">本资料最早发布在平特一肖高手榜，往期记录可查</p>
      <div class="records">
        <div class="record"><span class="issue">245期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="bracket">【</span><span class="pick">牛</span><span class="bracket">】【</span><span class="pick">18</span><span class="bracket">】</span><span class="result">开:牛18准</span></div>
        <div class="record"><span class="issue">246期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="bracket">【</span><span class="pick">牛</span><span class="bracket">】【</span><span class="pick">30</span><span class="bracket">】</span><span class="result">开:牛30准</span></div>
        <div class="record"><span class="issue">247期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="bracket">【</span><span class="pick">兔</span><span class="bracket">】【</span><span class="pick">40</span><span class="bracket">】</span><span class="result">开:兔40准</span></div>
        <div class="record"><span class="issue">248期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="bracket">【</span><span class="pick">猪</span><span class="bracket">】【</span><span class="pick">20</span><span class="bracket">】</span><span class="result">开:猪20准</span></div>
        <div class="record"><span class="issue">249期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="bracket">【</span><span class="pick">猴</span><span class="bracket">】【</span><span class="pick">23</span><span class="bracket">】</span><span class="result">开:猴23准</span></div>
        <div class="record"><span class="issue">250期:</span><span class="name">《斩钉截铁》</span><span class="category">一肖中特</span><span class="locked">【此内容需要注册会员查看】</span></div>
      </div>
      <div class="shared-detail-footer" id="sharedFooter"></div>
    </section>
  </main>
  <div id="memberDetailAd"></div>
  <footer class="site-footer">
    <strong>一路发平特一肖资料站</strong>
    <p>资料仅供参考，请理性浏览</p>
    <p>© 2026 平特资料站</p>
    <button class="to-top" type="button" onclick="scrollTo({top:0,behavior:'smooth'})">返回顶部</button>
  </footer>
  </div>
<script>
(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)return;const detail=await fetch('/api/member-posts?id='+encodeURIComponent(id),{cache:'no-store'}).then(r=>r.json()),post=detail.post;if(!detail.success||!post)return;const modern=String(post.period||'').startsWith('member-v2:'),kind=(modern?String(post.period).slice(10):(String(post.content||'').match(/《[^》]+》\s*([^【\r\n]+)/)?.[1]||'平特一肖')).replace(/^【|】$/g,'').trim(),author=String(post.title||'平特主任').replace(/^《|》$/g,''),type=[1,5,8].includes(Number(post.lottery_type))?Number(post.lottery_type):5,limit=Math.max(1,Math.min(100,Number(post.hit_status)||Number(String(post.title||'').match(/【(\d+)期中\d+期】/)?.[1])||20)),year=new Date().getFullYear(),read=x=>x?.data?.recordList||x?.recordList||x?.data?.list||x?.list||[],first=await fetch('/api/history.php?lotteryType='+type+'&pageNum=1&year='+year,{cache:'no-store'}).then(r=>r.ok?r.json():null),pages=Math.min(20,Math.max(1,Number(first?.data?.pager?.totalPageCount||first?.pager?.totalPageCount)||1)),rest=await Promise.all(Array.from({length:pages-1},(_,i)=>fetch('/api/history.php?lotteryType='+type+'&pageNum='+(i+2)+'&year='+year,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null))),records=[...read(first),...rest.flatMap(read)].map(record=>{const m=String(record.period||record.issueNo||'').match(/(\d{1,3})$/),balls=(record.numberList||[]).filter(v=>v?.shengXiao);return m&&balls.length?{issue:Number(m[1]),period:m[1].padStart(3,'0'),balls}:null}).filter(Boolean).sort((a,b)=>a.issue-b.issue).slice(-limit);if(!records.length)return;const colors=['#f5c84b','#25d6e8','#b561ff','#ff4b4b'],add=(row,text,color,tag='span')=>{const el=document.createElement(tag);el.textContent=text;el.style.cssText='color:'+color+';font-weight:900';row.appendChild(el);return el},valueFor=record=>{const seed=[...String(id)+record.period].reduce((n,c)=>(n*31+c.charCodeAt(0))>>>0,7),regular=record.balls.slice(0,6),numberCount=kind.includes('三中三')?3:kind.includes('二中二')?2:0;if(numberCount)return regular.slice(seed%Math.max(1,regular.length-numberCount+1),seed%Math.max(1,regular.length-numberCount+1)+numberCount).map(v=>String(v.number).padStart(2,'0')).sort((a,b)=>Number(a)-Number(b)).join(' ');return record.balls[seed%record.balls.length].shengXiao},nodes=records.map(record=>{const row=document.createElement('div');row.className='record';add(row,record.period+'期：',colors[0]);add(row,'《'+author+'》',colors[1]);add(row,kind,colors[2]);add(row,'【'+valueFor(record)+'】',colors[3]);add(row,'准',colors[0]);return row}),last=records.at(-1),nextPeriod=String(last.issue+1).padStart(3,'0'),next=document.createElement('div');next.className='record';add(next,nextPeriod+'期：',colors[0]);add(next,'《'+author+'》',colors[1]);add(next,kind,colors[2]);const link=add(next,'【注册提前看料】',colors[3],'a');link.href='/api/member-post-register';link.target='_blank';link.rel='noopener noreferrer';link.style.textDecoration='none';nodes.push(next);document.querySelector('.panel h1').textContent=nextPeriod+'期: '+author+'→【'+kind+'】【'+limit+'期中'+limit+'期】';document.querySelector('.records').replaceChildren(...nodes)}catch(e){console.error('member_history_render_failed',e);document.querySelector('.records').textContent='会员贴读取失败，请刷新重试'}})();
</script>
<script>
(async()=>{try{const response=await fetch('/api/shared-footer',{cache:'no-store'}),payload=await response.json();if(response.ok&&payload?.success&&payload.html)document.getElementById('sharedFooter').innerHTML=payload.html}catch(_){}})();
(async()=>{try{const response=await fetch('/api/ads.php',{cache:'no-store'}),data=await response.json(),item=data?.ads?.detail;if(!response.ok||!item?.image)return;const ad=document.createElement('a');ad.href=item.link||'#';ad.target='_blank';ad.rel='noopener noreferrer';ad.style.cssText='display:block;width:100%;margin:10px 0 14px;border:1px solid #453a20;border-radius:8px;overflow:hidden;background:#151515;line-height:0';if(!item.link)ad.addEventListener('click',event=>event.preventDefault());const image=document.createElement('img');image.src=item.image;image.alt='内容页广告';image.style.cssText='display:block;width:100%;height:auto;max-height:none;object-fit:contain';ad.appendChild(image);document.getElementById('memberDetailAd')?.appendChild(ad)}catch(_){}})();
</script>
</body>
</html>
